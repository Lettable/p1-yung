[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_media_address=121.127.33.217
external_signaling_address=121.127.33.217
local_net=121.127.33.217/32

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

[bitcall-endpoint]
type=endpoint
context=outbound-coinbase
aors=bitcall-aor
auth=bitcall-auth
outbound_auth=bitcall-auth
disallow=all
allow=ulaw
allow=alaw
dtmf_mode=rfc4733
transport=transport-udp
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes
direct_media=no
from_user=melapela
from_domain=gateway.bitcall.io
trust_id_outbound=yes
send_rpid=yes
send_pai=yes

[bitcall-auth]
type=auth
auth_type=userpass
username=melapela
password=Anton123@

[bitcall-aor]
type=aor
contact=sip:gateway.bitcall.io:5060
max_contacts=1
qualify_frequency=0

[bitcall-reg]
type=registration
outbound_auth=bitcall-auth
server_uri=sip:gateway.bitcall.io:5060
client_uri=sip:melapela@121.127.33.217:5060
contact_user=melapela
expiration=3600
retry_interval=60

[bitcall-id]
type=identify
endpoint=bitcall-endpoint
match=gateway.bitcall.io