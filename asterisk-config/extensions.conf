[general]
autofallthrough=yes

[outbound-coinbase]
exten => _X.,1,Answer()
exten => _X.,n,Progress()
exten => _X.,n,Background(coinbaseintro)
exten => _X.,n,GotoIf($["${EXTEN}" = "1"]?wait:hangup)
exten => _X.,n(wait),Wait(60)
exten => _X.,n,Hangup()
exten => _X.,n(hangup),Hangup()

[outbound-apple]
exten => _X.,1,Answer()
exten => _X.,n,Progress()
exten => _X.,n,Background(appleintro)
exten => _X.,n,GotoIf($["${EXTEN}" = "1"]?wait:hangup)
exten => _X.,n(wait),Wait(60)
exten => _X.,n,Hangup()
exten => _X.,n(hangup),Hangup()

[transfer-to-agent]
exten => _X.,1,Dial(PJSIP/${EXTEN}@bitcall-endpoint,60)
exten => _X.,n,Hangup()

